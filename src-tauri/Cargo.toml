[package]
name = "folio"
version = "0.1.0"
description = "Folio for Mac"
edition = "2021"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
